name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Regression tests
        run: |
          pip install pytest fastapi httpx numpy
          python -m pytest -q

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:v3
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

      - name: Make package public
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          PKG=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          curl -s -o /tmp/resp.json -w "%{http_code}\n" -X PATCH \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${PKG}" \
            -d '{"visibility":"public"}'
          cat /tmp/resp.json | head -c 300
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
